version: '3.8'

services:
  mop-webapp-staging:
    image: tracynguyen203/mop-webapp:staging
    container_name: mop-webapp-staging
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=staging
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - GCS_IMAGES_BUCKET=${GCS_IMAGES_BUCKET}
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcs-key.json
    volumes:
      - ${GCS_KEY_PATH}:/secrets/gcs-key.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3