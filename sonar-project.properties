sonar.projectKey=MOP-Code
sonar.projectName=MOP-Code
sonar.projectVersion=1.0

# Source locations
sonar.sources=next_webapp
sonar.tests=next_webapp

# Coverage reports produced by the Test stage
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.javascript.lcov.reportPaths=next_webapp/coverage/lcov.info

# Exclude generated / vendor code from analysis
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/coverage/**,**/*.config.js

# Quality gate: fail the pipeline (mark UNSTABLE) if this gate is not OK
sonar.qualitygate.wait=true
sonar.sourceEncoding=UTF-8